language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!bin/**"
    - "!obj/**"
    - "!publish/**"
    - "!dist/**"
    - "!installer/bin/**"
    - "!installer/obj/**"
    - "!**/*.zip"
    - "!**/*.exe"

chat:
  auto_reply: true
