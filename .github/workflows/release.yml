name: Release Backtrack

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract Tag Version
        id: get_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish Backtrack Binaries
        shell: pwsh
        run: |
          dotnet publish -c Release -r win-x64 -o "./publish"

      - name: Create Payload ZIP and Release Archive
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          $tag = "${{ steps.get_version.outputs.TAG }}"
          $payloadZip = [System.IO.Path]::GetFullPath("installer/payload.zip")
          $releaseZip = [System.IO.Path]::GetFullPath("Backtrack-$tag-win-x64.zip")
          if ([System.IO.File]::Exists($payloadZip)) { [System.IO.File]::Delete($payloadZip) }
          if ([System.IO.File]::Exists($releaseZip)) { [System.IO.File]::Delete($releaseZip) }
          [System.IO.Compression.ZipFile]::CreateFromDirectory([System.IO.Path]::GetFullPath("./publish"), $payloadZip)
          [System.IO.File]::Copy($payloadZip, $releaseZip, $true)

      - name: Build Installer Executable
        shell: pwsh
        run: |
          $tag = "${{ steps.get_version.outputs.TAG }}"
          dotnet publish ./installer/BacktrackSetup.csproj -c Release -r win-x64 -o "./dist" -p:AssemblyName="Backtrack-Setup-$tag"
          Copy-Item "./dist/Backtrack-Setup-$tag.exe" -Destination "./Backtrack-Setup-$tag.exe" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Backtrack-Setup-${{ steps.get_version.outputs.TAG }}.exe
            Backtrack-${{ steps.get_version.outputs.TAG }}-win-x64.zip
